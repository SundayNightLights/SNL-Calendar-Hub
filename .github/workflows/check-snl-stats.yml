name: Check SNL Stats Import

# Manual, non-publishing test. Does not modify the calendar sync or deploy Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stats:
    runs-on: ubuntu-latest
    # Reuse the same environment as the working calendar workflow in case
    # Microsoft secrets are stored as GitHub environment secrets.
    environment:
      name: github-pages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install msal requests

      - name: Download SNL stats CSVs from OneDrive
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MSAL_CACHE: ${{ secrets.MSAL_CACHE }}
        run: |
          python scripts/download_stats.py

      - name: Validate batting statistics without publishing
        run: |
          python scripts/generate_stats_data.py \
            --input-dir stats-input \
            --audit-output stats-audit.json

      - name: Verify statistics audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path('stats-audit.json')
          if not report.is_file():
              raise SystemExit('Stats audit not generated')

          data = json.loads(report.read_text(encoding='utf-8'))
          seasons = data.get('seasons', [])
          if not seasons:
              raise SystemExit('No SNL seasons were validated')

          for season in seasons:
              print(
                  f"{season['season_id']}: "
                  f"{season['player_count']} player records, "
                  f"{season['reporting_team_count']}/6 teams reporting"
              )
          print('Stats import check passed. No stats were published.')
          PY
