
name: Test New SNL Calendar Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install msal requests openpyxl

      - name: Download SNL Master from OneDrive
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MSAL_CACHE: ${{ secrets.MSAL_CACHE }}
        run: |
          python scripts/download_onedrive.py

      - name: Verify workbook structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("SNL Master.xlsx")

          assert path.exists(), (
              "SNL Master.xlsx was not downloaded"
          )

          wb = load_workbook(
              path,
              read_only=True
          )

          required = [
              "Regular Season Data",
              "Playoff Data",
              "Playoff Seeding"
          ]

          for name in required:
              assert name in wb.sheetnames, (
                  f"Missing worksheet: {name}"
              )

          for sheet, total in [
              ("Regular Season Data", 60),
              ("Playoff Data", 15)
          ]:
              ws = wb[sheet]

              ids = [
                  str(ws.cell(r, 1).value).strip()
                  for r in range(5, 5 + total)
              ]

              expected = [
                  f"F26-{n:03d}"
                  if total == 60
                  else f"F26-P{n:02d}"
                  for n in range(1, total + 1)
              ]

              assert ids == expected, (
                  f"Invalid Game IDs in {sheet}"
              )

              print(
                  f"{sheet}: {total} Game IDs verified"
              )

          wb.close()

          print("SNL Master workbook verified")

          PY

      - name: Generate six test calendars
        run: |
          rm -rf test-output

          python scripts/generate_calendars.py \
            "SNL Master.xlsx" \
            --output test-output \
            --reference reference

      - name: Verify permanent calendar filenames
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("test-output")

          teams = {
              "Buffaloes": "Buffaloes.ics",
              "IHT": "IHT.ics",
              "MORSL": "MORSL.ics",
              "Outcasts": "Outcasts.ics",
              "Pacific Maul": "Pacific_Maul.ics",
              "Toronto Raccoons": "Toronto_Raccoons.ics"
          }

          actual = {
              p.name for p in output.glob("*.ics")
          }

          expected = set(teams.values())

          assert actual == expected, (
              f"Expected {sorted(expected)}, "
              f"found {sorted(actual)}"
          )

          for team, filename in teams.items():
              data = (
                  output / filename
              ).read_text(encoding="utf-8")

              count = data.count("BEGIN:VEVENT")

              assert count >= 20, (
                  f"{filename}: only {count} events"
              )

              assert f"NAME:{team}" in data, (
                  f"{filename}: incorrect calendar name"
              )

              assert f"X-WR-CALNAME:{team}" in data, (
                  f"{filename}: incorrect display name"
              )

              assert "Markham Sports Dome" in data, (
                  f"{filename}: venue missing"
              )

              assert "UID:" in data, (
                  f"{filename}: event IDs missing"
              )

              print(
                  f"PASSED: {filename} "
                  f"({count} events)"
              )

          print("ALL SIX TEAM CALENDARS VERIFIED")

          PY

      - name: Verify subscription website
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("subscribe.html").read_text(
              encoding="utf-8"
          )

          assert "Select your team" in page
          assert "window.location.href" in page
          assert 'team.value + ".ics"' in page
          assert "Schedules-Fall-26" not in page
          assert "_Fall_2026-27.ics" not in page

          print("Subscription page verified")
          print("No old repository or calendar filenames")

          PY

      - name: Final test summary
        run: |
          echo "SNL MASTER: VERIFIED"
          echo "SIX TEAM CALENDARS: VERIFIED"
          echo "PERMANENT FILENAMES: VERIFIED"
          echo "SUBSCRIPTION WEBSITE: VERIFIED"
          echo "NO FILES PUBLISHED"
          echo "ALL TESTS PASSED"
