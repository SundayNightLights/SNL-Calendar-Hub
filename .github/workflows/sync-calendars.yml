
name: Sync SNL Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snl-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install msal requests openpyxl

      - name: Download SNL Master from OneDrive
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MSAL_CACHE: ${{ secrets.MSAL_CACHE }}
        run: |
          python scripts/download_onedrive.py

      - name: Generate six team calendars
        run: |
          rm -rf public

          python scripts/generate_calendars.py \
            "SNL Master.xlsx" \
            --output public \
            --reference reference

      - name: Verify six permanent team calendars
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("public")

          teams = {
              "Buffaloes": "Buffaloes.ics",
              "IHT": "IHT.ics",
              "MORSL": "MORSL.ics",
              "Outcasts": "Outcasts.ics",
              "Pacific Maul": "Pacific_Maul.ics",
              "Toronto Raccoons": "Toronto_Raccoons.ics",
          }

          actual = {
              file.name
              for file in output.glob("*.ics")
          }

          expected = set(teams.values())

          if actual != expected:
              raise SystemExit(
                  f"Calendar filenames incorrect. "
                  f"Expected {sorted(expected)}, "
                  f"found {sorted(actual)}"
              )

          for team, filename in teams.items():
              path = output / filename

              content = path.read_text(
                  encoding="utf-8"
              )

              count = content.count("BEGIN:VEVENT")

              if count < 20:
                  raise SystemExit(
                      f"{filename}: only {count} events"
                  )

              if f"X-WR-CALNAME:{team}" not in content:
                  raise SystemExit(
                      f"{filename}: wrong calendar name"
                  )

              if "Markham Sports Dome" not in content:
                  raise SystemExit(
                      f"{filename}: venue missing"
                  )

              if "UID:" not in content:
                  raise SystemExit(
                      f"{filename}: event IDs missing"
                  )

              print(
                  f"VERIFIED: {filename} "
                  f"({count} events)"
              )

          print("All six SNL calendars verified")
          PY

      - name: Generate website schedule and standings data
        run: |
          python scripts/generate_website_data.py \
            "SNL Master.xlsx" \
            --output public/site-data.json

      - name: Verify website data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/site-data.json")

          if not path.is_file():
              raise SystemExit(
                  "Website data file missing"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if len(data["regularSeason"]) != 60:
              raise SystemExit(
                  "Expected 60 regular-season games"
              )

          if len(data["standings"]) != 6:
              raise SystemExit(
                  "Expected 6 teams in standings"
              )

          if len(data["playoffs"]) != 15:
              raise SystemExit(
                  "Expected 15 playoff game slots"
              )

          print("SNL website data verified")
          PY

      - name: Add subscription website
        run: |
          cp subscribe.html public/subscribe.html

      - name: Verify website before publishing
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("public")

          required = [
              "index.html",
              "subscribe.html",
              "Buffaloes.ics",
              "IHT.ics",
              "MORSL.ics",
              "Outcasts.ics",
              "Pacific_Maul.ics",
              "Toronto_Raccoons.ics",
              "site-data.json",
          ]

          for filename in required:
              if not (output / filename).is_file():
                  raise SystemExit(
                      f"Missing publication file: {filename}"
                  )

          page = (
              output / "subscribe.html"
          ).read_text(encoding="utf-8")

          if "Select your team" not in page:
              raise SystemExit(
                  "Missing team selector"
              )

          if 'team.value + ".ics"' not in page:
              raise SystemExit(
                  "Subscription links not updated"
              )

          if "Schedules-Fall-26" in page:
              raise SystemExit(
                  "Old repository URL found"
              )

          if "_Fall_2026-27.ics" in page:
              raise SystemExit(
                  "Old calendar filename found"
              )

          print("Subscription website verified")
          print("All publication files are ready")
          PY

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish calendars
        id: deployment
        uses: actions/deploy-pages@v4
